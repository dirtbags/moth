stages:
  - test
  - build
  - push

Run unit tests:
  stage: test
  image: &goimage golang:1.22
  only:
    refs:
      - main
      - v5
      - tags
      - merge_requests
  script:
    - go test -coverprofile=coverage.txt -covermode=atomic -race ./...
    - go tool cover -html=coverage.txt -o coverage.html
    - go tool cover -func coverage.txt
  coverage: /\(statements\)(?:\s+)?(\d+(?:\.\d+)?%)/
  artifacts:
    paths:
    - coverage.html
    - coverage.txt

Generage coverage XML:
  stage: test
  image: *goimage
  needs: ["Run unit tests"]
  script:
    - go get github.com/boumenot/gocover-cobertura
    - go run github.com/boumenot/gocover-cobertura < coverage.txt > coverage.xml
  only:
    refs:
      - main
      - v5
      - tags
      - merge_requests
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

winbuild:
  stage: build
  image: *goimage
  needs: ["Run unit tests"]
  only:
    refs:
      - main
      - tags
      - merge_requests
  script:
    - GOOS=windows GOARCH=amd64 go build -o . ./...
  artifacts:
    paths:
      - mothd.exe

linbuild:
  stage: build
  image: *goimage
  needs: ["Run unit tests"]
  script:
    - GOOS=linux GOARCH=amd64 go build -o . ./...
  only:
    refs:
      - main
      - tags
      - merge_requests
  artifacts:
    paths:
      - mothd

docker-push:
  stage: push
  needs: ["Run unit tests"]
  only:
    refs:
      - tags
  variables:
  script:
    - mkdir ~/.docker
    - echo -n "$DOCKER_AUTH_CONFIG" | tee ~/.docker/config.json | md5sum
    - test -s ~/.docker/config.json
    - >
      docker build
      --file build/package/Containerfile
      --tag ghcr.io/dirtbags/moth:${CI_COMMIT_REF_SLUG}
      --tag ghcr.io/dirtbags/moth:${CI_COMMIT_REF_SLUG%.*}
      --tag ghcr.io/dirtbags/moth:${CI_COMMIT_REF_SLUG%.*.*}
      .
    - docker push ghcr.io/dirtbags/moth --all-tags
