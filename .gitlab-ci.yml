Run unit tests:
  stage: test
  image: &goimage golang:1.22
  only:
    refs:
      - main
      - v5
      - tags
      - merge_requests
  script:
    - go test -coverprofile=coverage.txt -covermode=atomic -race ./...
    - go tool cover -html=coverage.txt -o coverage.html
    - go tool cover -func coverage.txt
  coverage: /\(statements\)(?:\s+)?(\d+(?:\.\d+)?%)/
  artifacts:
    paths:
    - coverage.html
    - coverage.txt

Generage coverage XML:
  stage: test
  image: *goimage
  needs: ["Run unit tests"]
  script:
    - go get github.com/boumenot/gocover-cobertura
    - go run github.com/boumenot/gocover-cobertura < coverage.txt > coverage.xml
  only:
    refs:
      - main
      - v5
      - tags
      - merge_requests
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: build
  image: *goimage
  needs: ["Run unit tests"]
  only:
    refs:
      - main
      - tags
      - merge_requests
  script:
    - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o ./bin/windows.amd64/ ./...
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ./bin/linux.amd64/ ./...
    - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o ./bin/linux.arm64/ ./...
    - GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o ./bin/darwin.amd64/ ./...
    - GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o ./bin/darwin.arm64/ ./...
    - |
      # Build darwin multiarch binaries
      mkdir ./bin/darwin.multiarch/
      for name in ./bin/darwin.arm64/*; do
        filename=$(basename $name)
        go run github.com/randall77/makefat@latest ./bin/darwin.multiarch/$filename ./bin/darwin.amd64/$filename ./bin/darwin.arm64/$filename
      done
  artifacts:
    paths:
      - bin/

upload:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'curl --silent --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "./bin/windows.amd64/{mothd}.exe" "${PACKAGE_REGISTRY_URL}/windows.amd64/"'
    - 'curl --silent --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "./bin/linux.amd64/{mothd}" "${PACKAGE_REGISTRY_URL}/linux.amd64/"'
    - 'curl --silent --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "./bin/darwin.multiarch/{mothd}" "${PACKAGE_REGISTRY_URL}/darwin.multiarch/"'

docker-push:
  stage: deploy
  needs: ["Run unit tests"]
  only:
    refs:
      - tags
  variables:
  script:
    - mkdir ~/.docker
    - echo -n "$DOCKER_AUTH_CONFIG" | tee ~/.docker/config.json | md5sum
    - test -s ~/.docker/config.json
    - >
      docker build
      --file build/package/Containerfile
      --tag ghcr.io/dirtbags/moth:${CI_COMMIT_TAG}
      --tag ghcr.io/dirtbags/moth:${CI_COMMIT_TAG%.*}
      --tag ghcr.io/dirtbags/moth:${CI_COMMIT_TAG%.*.*}
      .
    - docker push ghcr.io/dirtbags/moth --all-tags
